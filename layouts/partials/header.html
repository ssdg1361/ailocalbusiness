{{- $here := .RelPermalink }}
<header class="wrap ax site-top">
  <a class="word" href="{{ "" | absLangURL }}" accesskey="h">AI Local Business<i>.</i></a>
  <nav aria-label="Main">
    <ul id="site-menu">
      <li><a href="/services/"{{ if eq $here "/services/" }} aria-current="page"{{ end }}>Services</a></li>
      <li><a href="/blog/"{{ if hasPrefix $here "/blog/" }} aria-current="page"{{ end }}>Blog</a></li>
      <li><a href="/about/"{{ if eq $here "/about/" }} aria-current="page"{{ end }}>About</a></li>
      <li><a href="/search/"{{ if eq $here "/search/" }} aria-current="page"{{ end }}>Search</a></li>
    </ul>
    <a class="button" href="/audit/" onclick="return gtag_report_conversion('/audit/');">Free presence check</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
  </nav>
</header>
