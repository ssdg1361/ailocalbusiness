{{- /* Facebook and Instagram links for Spencer Scott Digital. Pass (dict "labels" true) to show the words beside the icons. */ -}}
{{- $labels := .labels | default false }}
{{- with site.Params.social }}
<span class="ssdg-social{{ if $labels }} with-labels{{ end }}">
  <a href="{{ .facebook }}" target="_blank" rel="noopener" aria-label="Spencer Scott Digital on Facebook"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M13.6 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.3H8v3h2.5V21h3.1z"/></svg>{{ if $labels }}<span>Facebook</span>{{ end }}</a>
  <a href="{{ .instagram }}" target="_blank" rel="noopener" aria-label="Spencer Scott Digital on Instagram"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r="1.05" fill="currentColor" stroke="none"/></svg>{{ if $labels }}<span>Instagram</span>{{ end }}</a>
</span>
{{- end }}
