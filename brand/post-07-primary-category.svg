  <text class="mono-b" x="80" y="392" font-size="16" fill="#C25E33" letter-spacing="4">BEFORE</text>
  <rect x="80" y="410" width="440" height="330" rx="18" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="80" y="410" width="440" height="110" rx="18" fill="#DDD7CC"/>
  <rect x="80" y="480" width="440" height="40" fill="#DDD7CC"/>
  <text class="ui-b" x="106" y="560" font-size="26" fill="#1F1F1F">Your Roofing Co.</text>
  <text class="ui" x="106" y="592" font-size="16" fill="#5B6B63">4.9 ★★★★★ (63)</text>
  <text class="ui" x="106" y="628" font-size="18" fill="#3A3A3A">Contractor</text>
  <rect x="98" y="606" width="140" height="34" rx="6" fill="none" stroke="#C25E33" stroke-width="3"/>
  <text class="ui" x="106" y="662" font-size="15" fill="#5B6B63">Glen Rock, NJ · Open</text>
  <g>
    <rect x="106" y="686" width="90" height="30" rx="15" fill="#F0ECE4"/><text class="ui" x="151" y="706" font-size="13" fill="#3A3A3A" text-anchor="middle">Website</text>
    <rect x="206" y="686" width="90" height="30" rx="15" fill="#F0ECE4"/><text class="ui" x="251" y="706" font-size="13" fill="#3A3A3A" text-anchor="middle">Directions</text>
    <rect x="306" y="686" width="70" height="30" rx="15" fill="#F0ECE4"/><text class="ui" x="341" y="706" font-size="13" fill="#3A3A3A" text-anchor="middle">Call</text>
