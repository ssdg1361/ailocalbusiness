  <text class="serif" x="80" y="196" font-size="66" fill="#ECE6D9" letter-spacing="-2">One field decides which</text>
  <text class="serif" x="80" y="270" font-size="66" fill="#ECE6D9" letter-spacing="-2">searches you show up for.</text>

  <!-- cream lower area -->
  <rect x="0" y="330" width="1080" height="750" fill="#ECE6D9"/>

