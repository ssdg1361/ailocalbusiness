<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" width="1400" height="440">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .ssdg-serif { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-style: italic; }
      .ssdg-mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
      .ssdg-mono-bold { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    </style>
    <path id="ailbStampTop" d="M 50 220 A 110 110 0 0 1 270 220"/>
    <path id="ailbStampBot" d="M 50 220 A 110 110 0 0 0 270 220"/>
  </defs>
  <rect width="1400" height="440" fill="#F1F0EB"/>

  <!-- SSDG endorsement stamp on left -->
  <circle cx="160" cy="220" r="130" fill="none" stroke="#1F5045" stroke-width="2"/>
  <circle cx="160" cy="220" r="121" fill="none" stroke="#1F5045" stroke-width="1"/>
  <text class="ssdg-mono-bold" font-size="11" fill="#1F5045" letter-spacing="4">
    <textPath href="#ailbStampTop" startOffset="50%" text-anchor="middle">SPENCER · SCOTT · DIGITAL</textPath>
  </text>
  <text class="ssdg-mono-bold" font-size="10" fill="#1F5045" letter-spacing="3.5">
    <textPath href="#ailbStampBot" startOffset="50%" text-anchor="middle">GLEN ROCK · NJ</textPath>
  </text>
  <line x1="22" y1="220" x2="42" y2="220" stroke="#C25E33" stroke-width="2"/>
  <line x1="278" y1="220" x2="298" y2="220" stroke="#C25E33" stroke-width="2"/>
  <circle cx="15" cy="220" r="3" fill="#C25E33"/>
  <circle cx="305" cy="220" r="3" fill="#C25E33"/>
  <text class="ssdg-serif" x="160" y="244" font-size="68" text-anchor="middle" fill="#1B1F26" letter-spacing="-2.2">SSDG</text>

  <!-- Divider -->
  <line x1="350" y1="110" x2="350" y2="330" stroke="rgba(27,31,38,0.14)" stroke-width="2"/>

  <!-- AILB wordmark -->
  <text class="ssdg-serif" x="400" y="200" font-size="88" fill="#1B1F26" letter-spacing="-2.6">AI Local Business</text>
  <line x1="400" y1="232" x2="680" y2="232" stroke="#C25E33" stroke-width="4"/>
  <text class="ssdg-mono-bold" x="400" y="276" font-size="20" fill="#1F5045" letter-spacing="5">FOUND BY GOOGLE · RECOMMENDED BY AI</text>
  <text class="ssdg-mono" x="400" y="316" font-size="18" fill="#7A7F88" letter-spacing="4">A SPENCER SCOTT DIGITAL BRAND · AILOCALBUSINESS.BIZ</text>
