<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      @import url('https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&amp;f[]=switzer@400,500,600&amp;display=swap');
      .ssdg-serif-reg { font-family: 'Cabinet Grotesk', 'Switzer', system-ui, sans-serif; font-weight: 500; font-style: normal; }
      .ssdg-serif-emph { font-family: 'Cabinet Grotesk', 'Switzer', system-ui, sans-serif; font-weight: 800; font-style: normal; }
      .ssdg-serif-bold { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-style: italic; }
      .ssdg-serif-svc { font-family: 'Cabinet Grotesk', 'Switzer', system-ui, sans-serif; font-weight: 700; }
      .ssdg-body { font-family: 'Switzer', system-ui, sans-serif; font-weight: 400; }
      .ssdg-mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
      .ssdg-mono-bold { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    </style>
    <pattern id="dots2" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="rgba(27,31,38,0.07)"/>
    </pattern>
    <path id="footStampTop" d="M 90 990 A 50 50 0 0 1 190 990"/>
    <path id="footStampBot" d="M 90 990 A 50 50 0 0 0 190 990"/>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F1F0EB"/>
  <rect width="1080" height="1080" fill="url(#dots2)"/>
  <ellipse cx="900" cy="900" rx="380" ry="280" fill="rgba(194,94,51,0.05)"/>
  <ellipse cx="120" cy="180" rx="320" ry="240" fill="rgba(31,80,69,0.05)"/>

  <!-- Brand bar -->
  <rect width="1080" height="6" fill="#1F5045"/>

  <!-- Eyebrow -->
  <g transform="translate(80, 120)">
    <circle cx="0" cy="-7" r="6" fill="#C25E33"/>
    <text class="ssdg-mono-bold" x="22" y="0" font-size="22" fill="#C25E33" letter-spacing="6">WHAT WE DO</text>
  </g>

  <!-- Headline -->
  <text class="ssdg-serif-reg" x="80" y="240" font-size="78" fill="#1B1F26" letter-spacing="-2.2">Three ways to get</text>
  <text class="ssdg-serif-reg" x="80" y="324" font-size="78" fill="#1B1F26" letter-spacing="-2.2">your business <tspan class="ssdg-serif-emph" fill="#1F5045">found</tspan>.</text>

  <!-- Divider -->
  <line x1="80" y1="390" x2="280" y2="390" stroke="#C25E33" stroke-width="3"/>

  <!-- Service 01 -->
  <g>
    <text class="ssdg-mono-bold" x="80" y="478" font-size="20" fill="#1F5045" letter-spacing="5">01</text>
    <text class="ssdg-serif-svc" x="160" y="478" font-size="44" fill="#1B1F26" letter-spacing="-1">Local SEO</text>
    <text class="ssdg-body" x="160" y="520" font-size="24" fill="#4A4F58">Show up when neighbors search "near me."</text>
    <line x1="80" y1="560" x2="1000" y2="560" stroke="rgba(27,31,38,0.1)" stroke-width="1"/>
  </g>

  <!-- Service 02 -->
  <g>
    <text class="ssdg-mono-bold" x="80" y="628" font-size="20" fill="#1F5045" letter-spacing="5">02</text>
    <text class="ssdg-serif-svc" x="160" y="628" font-size="44" fill="#1B1F26" letter-spacing="-1">Google Ads</text>
    <text class="ssdg-body" x="160" y="670" font-size="24" fill="#4A4F58">Win paid placement when intent is highest.</text>
    <line x1="80" y1="710" x2="1000" y2="710" stroke="rgba(27,31,38,0.1)" stroke-width="1"/>
  </g>

  <!-- Service 03 -->
  <g>
    <text class="ssdg-mono-bold" x="80" y="778" font-size="20" fill="#1F5045" letter-spacing="5">03</text>
    <text class="ssdg-serif-svc" x="160" y="778" font-size="44" fill="#1B1F26" letter-spacing="-1">AI Search</text>
    <text class="ssdg-body" x="160" y="820" font-size="24" fill="#4A4F58">Get recommended when they ask ChatGPT,</text>
    <text class="ssdg-body" x="160" y="852" font-size="24" fill="#4A4F58">Gemini, or Perplexity.</text>
  </g>

  <!-- Footer with stamp -->
  <g>
    <circle cx="140" cy="990" r="58" fill="none" stroke="#1F5045" stroke-width="1.5"/>
    <circle cx="140" cy="990" r="53" fill="none" stroke="#1F5045" stroke-width="0.7"/>
    <text class="ssdg-mono-bold" font-size="7" fill="#1F5045" letter-spacing="2.5">
      <textPath href="#footStampTop" startOffset="50%" text-anchor="middle">SPENCER · SCOTT · DIGITAL</textPath>
    </text>
    <text class="ssdg-mono-bold" font-size="6.5" fill="#1F5045" letter-spacing="2">
      <textPath href="#footStampBot" startOffset="50%" text-anchor="middle">GLEN ROCK · NJ</textPath>
    </text>
    <text class="ssdg-serif-bold" x="140" y="1003" font-size="30" text-anchor="middle" fill="#1B1F26" letter-spacing="-1">SSDG</text>

    <line x1="220" y1="950" x2="220" y2="1030" stroke="rgba(27,31,38,0.14)"/>
    <text class="ssdg-mono-bold" x="245" y="985" font-size="16" fill="#1B1F26" letter-spacing="3.5">AI LOCAL BUSINESS</text>
    <text class="ssdg-mono" x="245" y="1010" font-size="13" fill="#7A7F88" letter-spacing="3">AILOCALBUSINESS.BIZ</text>
  </g>
</svg>
