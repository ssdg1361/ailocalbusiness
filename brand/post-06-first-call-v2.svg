<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .serif { font-family: 'Fraunces', 'URW Bookman', Georgia, serif; font-weight: 700; }
      .serif-i { font-family: 'Fraunces', 'URW Bookman', Georgia, serif; font-weight: 800; font-style: italic; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-weight: 500; }
      .mono-b { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-weight: 600; }
      .ui { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; }
      .ui-b { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: bold; }
    </style>
    <clipPath id="screen"><rect x="70" y="120" width="420" height="860" rx="44"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Cream background -->
  <rect width="1080" height="1080" fill="#ECE6D9"/>
  <rect width="1080" height="8" fill="#1F5045"/>

  <!-- Phone shadow + body -->
  <rect x="80" y="140" width="420" height="860" rx="48" fill="#0E2620" opacity="0.18" filter="url(#soft)"/>
  <rect x="58" y="108" width="444" height="884" rx="56" fill="#0E2620"/>
  <rect x="70" y="120" width="420" height="860" rx="44" fill="#F7F4EE"/>

  <g clip-path="url(#screen)">
    <!-- status / header -->
    <rect x="70" y="120" width="420" height="72" fill="#F7F4EE"/>
    <text class="ui-b" x="280" y="166" font-size="17" fill="#0E2620" text-anchor="middle">AI assistant</text>
    <line x1="70" y1="192" x2="490" y2="192" stroke="#E2DCD0"/>

    <!-- user bubble -->
    <rect x="130" y="216" width="336" height="94" rx="22" fill="#1F5045"/>
    <text class="ui" x="152" y="252" font-size="19" fill="#ECE6D9">I think my roof is leaking.</text>
    <text class="ui" x="152" y="282" font-size="19" fill="#ECE6D9">Who should I call in Glen Rock?</text>

    <!-- AI reply -->
    <text class="ui" x="96" y="352" font-size="17" fill="#3A3A3A">Here are roofers near Glen Rock, NJ:</text>

    <!-- map block -->
    <rect x="94" y="368" width="372" height="120" rx="14" fill="#DCE5DF"/>
    <path d="M 94 400 L 466 430" stroke="#F7F4EE" stroke-width="10"/>
    <path d="M 200 368 L 240 488" stroke="#F7F4EE" stroke-width="8"/>
    <path d="M 330 368 L 300 488" stroke="#F7F4EE" stroke-width="8"/>
    <g fill="#C25E33">
      <circle cx="170" cy="412" r="9"/><circle cx="290" cy="440" r="9"/><circle cx="380" cy="400" r="9"/><circle cx="410" cy="460" r="9"/>
    </g>
    <text class="ui-b" x="106" y="480" font-size="12" fill="#5B6B63">Glen Rock · Ridgewood · Fair Lawn</text>

    <!-- card 1: Mattsson (highlighted) -->
    <rect x="94" y="504" width="372" height="86" rx="14" fill="#FFFFFF" stroke="#6FB59E" stroke-width="3"/>
    <text class="ui-b" x="112" y="536" font-size="19" fill="#0E2620">Mattsson Roofing</text>
    <text class="ui" x="112" y="562" font-size="15" fill="#5B6B63">★★★★★  ·  Glen Rock, NJ</text>
    <rect x="378" y="528" width="72" height="34" rx="17" fill="#1F5045"/>
    <text class="ui-b" x="414" y="551" font-size="14" fill="#ECE6D9" text-anchor="middle">Call</text>

    <!-- cards 2-4: anonymous -->
    <g fill="#FFFFFF" stroke="#E2DCD0" stroke-width="2">
      <rect x="94" y="602" width="372" height="62" rx="14"/>
      <rect x="94" y="676" width="372" height="62" rx="14"/>
      <rect x="94" y="750" width="372" height="62" rx="14"/>
    </g>
    <g fill="#D8D2C6">
      <rect x="112" y="622" width="170" height="12" rx="6"/><rect x="112" y="642" width="110" height="9" rx="4"/>
      <rect x="112" y="696" width="200" height="12" rx="6"/><rect x="112" y="716" width="95" height="9" rx="4"/>
      <rect x="112" y="770" width="150" height="12" rx="6"/><rect x="112" y="790" width="120" height="9" rx="4"/>
    </g>
    <g fill="#EDE8DF"><rect x="378" y="616" width="72" height="34" rx="17"/><rect x="378" y="690" width="72" height="34" rx="17"/><rect x="378" y="764" width="72" height="34" rx="17"/></g>

    <!-- the line -->
    <rect x="94" y="832" width="372" height="72" rx="14" fill="#FFF3D6"/>
    <text class="ui-b" x="112" y="862" font-size="17" fill="#0E2620">My first call would be</text>
    <text class="ui-b" x="112" y="888" font-size="17" fill="#0E2620">Mattsson.</text>

    <!-- input bar -->
    <rect x="94" y="924" width="372" height="44" rx="22" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="2"/>
    <text class="ui" x="114" y="952" font-size="15" fill="#A8A29A">Ask a follow-up</text>
  </g>

  <!-- red circle on the line -->
  <ellipse cx="280" cy="866" rx="196" ry="40" fill="none" stroke="#C25E33" stroke-width="5" transform="rotate(-2 280 868)"/>

  <!-- Right side copy -->
  <text class="mono-b" x="560" y="200" font-size="18" fill="#C25E33" letter-spacing="5">GLEN ROCK, NJ · THIS WEEK</text>

  <text class="serif" x="560" y="330" font-size="150" fill="#0E2620" letter-spacing="-6">4</text>
  <text class="serif" x="680" y="330" font-size="42" fill="#0E2620" letter-spacing="-1">roofers named</text>

  <text class="serif" x="560" y="480" font-size="150" fill="#0E2620" letter-spacing="-6">1</text>
  <text class="serif" x="680" y="480" font-size="42" fill="#0E2620" letter-spacing="-1">recommended</text>

  <text class="serif" x="560" y="630" font-size="150" fill="#C25E33" letter-spacing="-6">0</text>
  <text class="serif" x="680" y="630" font-size="42" fill="#0E2620" letter-spacing="-1">clicks needed</text>

  <line x1="560" y1="690" x2="700" y2="690" stroke="#1F5045" stroke-width="4"/>

  <text class="serif-i" x="560" y="770" font-size="44" fill="#1F5045" letter-spacing="-1">That's not a search.</text>
  <text class="serif-i" x="560" y="826" font-size="44" fill="#1F5045" letter-spacing="-1">That's a referral.</text>

  <text class="mono" x="560" y="900" font-size="20" fill="#3A3A3A">Is your business the one</text>
  <text class="mono" x="560" y="930" font-size="20" fill="#3A3A3A">AI tells people to call?</text>

  <!-- footer -->
  <text class="serif-i" x="560" y="1010" font-size="26" fill="#0E2620">SSDG</text>
  <line x1="650" y1="990" x2="650" y2="1018" stroke="#0E2620" opacity="0.3"/>
  <text class="mono-b" x="668" y="1010" font-size="15" fill="#0E2620" letter-spacing="3">AILOCALBUSINESS.BIZ/AI-CHECK</text>
</svg>
